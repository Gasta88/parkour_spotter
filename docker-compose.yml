services:
  postgis:
    build:
      context: .
      dockerfile: services/postgis/Dockerfile
    container_name: parkour-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parkour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkour}
      POSTGRES_DB: ${POSTGRES_DB:-parkour}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-h3-pg.sql:/docker-entrypoint-initdb.d/init-h3-pg.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkour} -d ${POSTGRES_DB:-parkour}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all

  osm-loader:
    build:
      context: ./scripts/osm-loader
      dockerfile: Dockerfile
    container_name: parkour-osm-loader
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parkour}:${POSTGRES_PASSWORD:-parkour}@postgis:5432/${POSTGRES_DB:-parkour}
      OSM_URL: ${OSM_URL:-https://download.bbbike.org/osm/bbbike/Padova/Padova.osm.pbf}
      OSM_MIN_FILE_SIZE_MB: ${OSM_MIN_FILE_SIZE_MB:-1}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-24}
      FORCE_RELOAD: ${FORCE_RELOAD:-false}
      OSM2PGSQL_CACHE_MB: ${OSM2PGSQL_CACHE_MB:-512}
      OSM2PGSQL_PROCESSES: ${OSM2PGSQL_PROCESSES:-2}
      OSM_LOCAL_FILE: ${OSM_LOCAL_FILE:-}
    volumes:
      - ./data:/osm-data
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: common/Dockerfile
    container_name: parkour-migrate
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parkour}:${POSTGRES_PASSWORD:-parkour}@postgis:5432/${POSTGRES_DB:-parkour}
    working_dir: /app/common
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: parkour-api
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parkour}:${POSTGRES_PASSWORD:-parkour}@postgis:5432/${POSTGRES_DB:-parkour}
      H3_RESOLUTION: ${H3_RESOLUTION:-11}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./common:/app/common
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  annotator:
    build:
      context: .
      dockerfile: services/annotator/Dockerfile
    container_name: parkour-annotator
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parkour}:${POSTGRES_PASSWORD:-parkour}@postgis:5432/${POSTGRES_DB:-parkour}
    ports:
      - "${ANNOTATOR_PORT:-8001}:8001"
    volumes:
      - ./common:/app/common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: parkour-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  postgres_data:
